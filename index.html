<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Brief — Woomi Global</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B3A5C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Brief">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
          onerror="console.error('marked.js 로드 실패')"></script>
  <script>
    if (typeof Chart === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" onerror="console.error(\'Chart.js 로드 실패\')"><\/script>');
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #333;
      font-size: 14px;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      padding: 20px 24px;
      min-width: 0;
    }

    /* ── App header (The Brief) ── */
    .app-header { text-align: center; padding: 16px 0 8px; border-bottom: 2px solid #1B3A5C; margin-bottom: 20px; }
    .app-header-meta { font-size: 10px; letter-spacing: 2px; color: #888; margin-bottom: 6px; }
    .app-header-rule { height: 2px; background: #1B3A5C; margin: 6px 0; }
    .app-header-title { display: flex; align-items: baseline; justify-content: center; gap: 10px; }
    .app-header-the { font-size: 18px; font-weight: 500; letter-spacing: 5px; color: #1B3A5C; font-family: sans-serif; }
    .app-header-brief { font-size: 48px; font-weight: 700; color: #1B3A5C; font-family: Georgia, serif; line-height: 1; }
    .app-header-date { font-size: 10px; color: #888; margin-top: 4px; }

    /* ── Section ── */
    .section { margin-bottom: 28px; }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid #eee;
    }

    /* ── Page tabs (뉴스 / 인텔리전스) ── */
    .page-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
    }
    .page-tab-btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: none;
      cursor: pointer;
      color: #888;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .page-tab-btn:hover { color: #1B3A5C; }
    .page-tab-btn.active { color: #1B3A5C; border-bottom-color: #1B3A5C; }
    .page-panel { display: none; }
    .page-panel.active { display: block; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 1px solid #ddd; }
    .tab-btn {
      padding: 7px 14px;
      font-size: 12px;
      border: none;
      background: none;
      cursor: pointer;
      color: #666;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #333; }
    .tab-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Scroll box ── */
    .scroll-box {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    .scroll-inner {
      overflow-y: auto;
      overflow-x: auto;
    }
    .scroll-inner.h-400 { max-height: 400px; }
    .scroll-inner.h-500 { max-height: 500px; }
    .scroll-inner.h-600 { max-height: 600px; }

    /* ── Table ── */
    .tbl-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    thead tr { border-bottom: 1px solid #ddd; }
    thead th {
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 2;
      box-shadow: 0 1px 0 #ddd;
    }
    th {
      padding: 5px 6px;
      font-size: 11px;
      font-weight: 600;
      text-align: left;
      color: #555;
      white-space: nowrap;
    }
    td {
      padding: 4px 6px;
      font-size: 12px;
      vertical-align: top;
      border-bottom: 1px solid #f0f0f0;
    }
    tr:hover td { background: #fafafa; }

    .col-date      { width: 48px; white-space: nowrap; color: #888; font-size: 11px; }
    .col-title     { width: 35%; }
    .col-sector    { width: 80px; color: #555; font-size: 11px; }
    .col-tags      { width: 110px; color: #666; font-size: 11px; word-break: break-word; }
    .col-rationale { color: #666; font-size: 11px; word-break: break-word; }

    .title-link {
      color: #1a73e8;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.4;
    }
    .title-link:hover { text-decoration: underline; }
    .star { color: #f4b400; }

    .empty-msg { font-size: 13px; color: #999; padding: 12px 4px; }

    .sh-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; margin-bottom: 10px; }

    /* ── Spinner ── */
    #spinner {
      display: flex; align-items: center; justify-content: center;
      padding: 60px; color: #999; font-size: 14px; gap: 10px;
    }
    .spin {
      width: 20px; height: 20px;
      border: 3px solid #ddd;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .main { padding: 12px 14px; }
      .app-header-brief { font-size: 36px; }
      .col-sector, .col-tags { display: none; }
      .col-rationale { width: 140px; }
    }

    /* 데스크톱: 기사 테이블 좌우에 스크롤 잡을 여백 확보 (모바일은 터치 스크롤이라 미적용) */
    @media (min-width: 769px) {
      #page-news .scroll-box { margin: 0 4%; }
    }

    /* ── Trend section ── */
    .trend-charts { display: flex; flex-direction: column; gap: 20px; }
    .trend-chart-box {
      background: #fff;
      border: 1px solid #1B3A5C;
      border-radius: 8px;
      padding: 14px 16px;
    }
    .trend-chart-title { font-size: 13px; font-weight: 600; color: #1B3A5C; margin-bottom: 10px; }
    .trend-chart-canvas-wrap { position: relative; height: 200px; }
    .trend-footnote { font-size: 11px; color: #999; margin-top: 10px; text-align: right; }

    /* ── Report archive stats ── */
    .archive-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      align-items: center;
      background: #f2f6fa;
      border: 1px solid #dce6ef;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 12px;
      color: #1B3A5C;
    }
    .archive-stats .stat-item { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
    .archive-stats .stat-num  { font-size: 15px; font-weight: 700; }
    .archive-stats .stat-sep  { color: #b8c7d6; }

    /* ── Report section ── */
    #reportContent h2 { font-size: 16px; font-weight: 700; margin: 18px 0 6px; color: #222; }
    #reportContent h3 { font-size: 14px; font-weight: 600; margin: 14px 0 4px; color: #333; }
    #reportContent ul  { padding-left: 18px; margin: 4px 0 10px; }
    #reportContent li  { margin-bottom: 4px; line-height: 1.6; }
    #reportContent p   { margin: 6px 0; }
    #reportContent hr  { border: none; border-top: 1px solid #ddd; margin: 14px 0; }
    #reportContent pre { background: #f5f5f5; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto; }

    /* ── Article popup ── */
    #articleOverlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #articleOverlay.open { display: flex; }
    #articlePopup {
      background: #fff;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    #articlePopup .pop-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    #articlePopup .pop-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 14px;
    }
    #articlePopup hr { border: none; border-top: 1px solid #eee; margin: 14px 0; }
    #articlePopup .pop-summary {
      font-size: 13px;
      line-height: 1.8;
      color: #333;
      white-space: pre-wrap;
    }
    #articlePopup .pop-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    #articlePopup .pop-actions a, #articlePopup .pop-actions button {
      padding: 7px 16px;
      border-radius: 5px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      text-decoration: none;
    }
    #popOriginalLink {
      background: #1a73e8;
      color: #fff;
    }
    #popClose {
      background: #f0f0f0;
      color: #333;
    }
  </style>
</head>
<body>

<div class="layout">

<script>
const CSV_URL = "https://raw.githubusercontent.com/jaehongbr-Coding/us-residential-v2/main/articles.csv";
let allRows = [];

/* ── Helpers ── */
function getLatestDateRange(rows) {
  const dates = rows
    .map(r => r.published_at ? r.published_at.slice(0, 10) : null)
    .filter(Boolean)
    .sort()
    .reverse();
  if (!dates.length) return { from: null, to: null };
  const latest = dates[0];
  const latestDate = new Date(latest);
  latestDate.setDate(latestDate.getDate() - 1);
  const from = latestDate.toISOString().slice(0, 10);
  return { from, to: latest };
}

function fmtDate(str) {
  if (!str) return "";
  const d = new Date(str);
  if (isNaN(d)) return "";
  return (d.getMonth() + 1).toString().padStart(2, "0") + "-" + d.getDate().toString().padStart(2, "0");
}

function parseDate(str) {
  if (!str) return null;
  const d = new Date(str);
  return isNaN(d) ? null : d;
}

function truncate(s, n) {
  if (!s) return "";
  return s.length > n ? s.slice(0, n) + "…" : s;
}

function hasTag(tags, ...keywords) {
  const t = (tags || "").toLowerCase();
  return keywords.some(k => t.includes(k));
}

/* ── Table builder ── */
function buildTable(rows, maxHeight = null) {
  if (!rows.length) return '<p class="empty-msg">관련 기사 없음</p>';
  const sorted = [...rows].sort((a, b) => {
    const da = parseDate(a.published_at), db = parseDate(b.published_at);
    if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
    return db - da;
  });
  const trs = sorted.map(r => {
    const star = r.woomi_relevance === "높음" ? '<span class="star">⭐ </span>' : "";
    const lock = r.access_limited === "True" ? "🔒 " : "";
    const idx  = allRows.indexOf(r);
    return `<tr>
      <td class="col-date">${fmtDate(r.published_at)}</td>
      <td class="col-title">
        <a class="title-link" href="#" onclick="openArticlePopup(${idx});return false;">
          ${star}${lock}${escHtml(r.title)}
        </a>
      </td>
      <td class="col-sector">${escHtml(r.sector)}</td>
      <td class="col-tags">${escHtml(r.event_tags)}</td>
      <td class="col-rationale">${escHtml(truncate(r.claude_rationale, 120))}</td>
    </tr>`;
  }).join("");
  return `<table>
    <thead><tr>
      <th class="col-date">날짜</th>
      <th class="col-title">제목</th>
      <th class="col-sector">섹터</th>
      <th class="col-tags">태그</th>
      <th class="col-rationale">분류근거</th>
    </tr></thead>
    <tbody>${trs}</tbody>
  </table>`;
  if (!maxHeight) return tableHtml;
  return `<div style="max-height:${maxHeight}px;overflow-y:auto;border:1px solid #e0e0e0;border-radius:8px;">${tableHtml}</div>`;
}

function escHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* ── Filter logic (유료 기사는 항상 숨김) ── */
function applyBaseFilters(rows) {
  return rows.filter(r => String(r.access_limited).toLowerCase() !== "true");
}

/* ── Render ── */
function render() {
  // Base filtered (유료 기사 숨김)
  const base = applyBaseFilters(allRows);

  // 전체 기사 기준 최신 날짜 범위 (핵심 모니터링 + 전략 신호 공용)
  const { from: latestFrom, to: latestTo } = getLatestDateRange(allRows);

  // ⭐ 핵심 모니터링 (전체 기사 최신 날짜 기준 2일치, 높음=0건이면 3일치로 확장)
  const highRows = (() => {
    // 1. 기본 필터 — 전체 기사 최신 날짜 기준
    const candidates = allRows.filter(r => {
      if (r.access_limited === "True") return false;
      if (r.woomi_relevance !== "높음") return false;
      const d = r.published_at ? r.published_at.slice(0, 10) : null;
      if (!d || d < latestFrom) return false;
      return true;
    }).sort((a, b) => {
      const da = parseDate(a.published_at), db = parseDate(b.published_at);
      if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
      return db - da;
    });

    // 2. 전체 중복 제거 (날짜 무관, 고유명사 2개 이상 겹치면 중복)
    function isDup(a, b) {
      const properA = (a.title || "").split(/\s+/).filter(w => /^[A-Z]/.test(w) && w.length > 3);
      const properB = new Set((b.title || "").split(/\s+/).filter(w => /^[A-Z]/.test(w) && w.length > 3));
      return properA.filter(w => properB.has(w)).length >= 2;
    }
    let deduped = candidates.reduce((acc, r) => {
      if (!acc.some(a => isDup(a, r))) acc.push(r);
      return acc;
    }, []);

    // 3. 높음 0건이면 3일치로 확장
    if (!deduped.length) {
      const extDate = new Date(latestTo);
      extDate.setDate(extDate.getDate() - 2);
      const extFrom = extDate.toISOString().slice(0, 10);
      const ext = allRows.filter(r => {
        if (r.access_limited === "True") return false;
        if (r.woomi_relevance !== "높음") return false;
        const d = r.published_at ? r.published_at.slice(0, 10) : null;
        return d && d >= extFrom;
      });
      deduped = ext.reduce((acc, r) => {
        if (!acc.some(a => isDup(a, r))) acc.push(r);
        return acc;
      }, []);
    }

    // 4. SH 캡 5건
    const nonSh = deduped.filter(r => r.sector !== "Student Housing");
    const sh    = deduped.filter(r => r.sector === "Student Housing");
    return [...nonSh, ...sh.slice(0, 5)];
  })();
  document.getElementById("highTitle").textContent = `🎯 핵심 모니터링 (${highRows.length}건)`;
  document.getElementById("highTable").innerHTML = buildTable(highRows, 400);

  // 전략 신호 — 전체 기사 최신 날짜 기준 2일치 (latestFrom 공용)
  const signalBase = allRows.filter(r => {
    if (r.access_limited === "True") return false;
    const d = r.published_at ? r.published_at.slice(0, 10) : null;
    if (!d || (latestFrom && d < latestFrom)) return false;
    return true;
  });

  const RESIDENTIAL_SECTORS = ["BTR", "SFR", "Multifamily", "Workforce Housing", "Affordable Housing"];
  const residential = signalBase.filter(r =>
    r.category === "개발" ||
    hasTag(r.event_tags, "construction_start", "permit", "land_acquisition", "delivery")
  );
  const cap = signalBase.filter(r =>
    r.category === "시장" && (
      hasTag(r.event_tags, "financing", "policy", "market_data", "rent_occupancy") ||
      r.source === "Federal Reserve"
    )
  );
  const gp = signalBase.filter(r =>
    r.category === "GP·자본흐름" &&
    hasTag(r.event_tags, "transaction", "acquisition", "jv")
  );
  const showLow = document.getElementById("shLow").checked;
  const sh = signalBase.filter(r =>
    r.sector === "Student Housing" && (showLow || r.woomi_relevance !== "낮음")
  );

  // Update tab labels (건수 = buildTable에 전달되는 실제 rows.length)
  const tabBtns = document.querySelectorAll("#signalTabs .tab-btn");
  tabBtns[0].textContent = `🏗️ 개발 동향 (${residential.length}건)`;
  tabBtns[1].textContent = `📊 시장·금리 (${cap.length}건)`;
  tabBtns[2].textContent = `🤝 GP·거래 동향 (${gp.length}건)`;
  tabBtns[3].textContent = `🎓 Student Housing (${sh.length}건)`;

  document.querySelector("#tab-residential .tbl-wrap").innerHTML = buildTable(residential, 500);
  document.querySelector("#tab-cap .tbl-wrap").innerHTML         = buildTable(cap, 500);
  document.querySelector("#tab-gp .tbl-wrap").innerHTML          = buildTable(gp, 500);
  document.querySelector("#tab-sh .tbl-wrap").innerHTML          = buildTable(sh, 500);

  // 전체 기사 — 유료 기사 숨김 + 검색어 AND
  const searchQ = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  const baseFiltered = searchQ
    ? base.filter(r =>
        (r.title || "").toLowerCase().includes(searchQ) ||
        (r.summary || "").toLowerCase().includes(searchQ) ||
        (r.claude_rationale || "").toLowerCase().includes(searchQ)
      )
    : base;
  document.getElementById("allTitle").textContent = `전체 기사 (${baseFiltered.length}건)`;
  document.getElementById("allTable").innerHTML = buildTable(baseFiltered, 600);
}

/* ── Page switching (📰 뉴스 / 📊 인텔리전스) ── */

  document.querySelectorAll(".page-tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".page-panel").forEach(p => p.classList.remove("active"));

/* ── Archive stats (누적 지표 헤더) ── */
const archiveState = { reportCount: null, earliestDate: null, articleCount: null };

function updateArchiveStats() {
  const el = document.getElementById("archiveStats");
  if (!el) return;
  const parts = [];
  if (archiveState.earliestDate) {
    const days  = Math.floor((new Date() - new Date(archiveState.earliestDate)) / 86400000);
    const weeks = Math.max(1, Math.floor(days / 7));
    parts.push(`<span class="stat-item"><span class="stat-num">${weeks}</span>주 연속 수집</span>`);
  }
  if (archiveState.reportCount !== null) {
    parts.push(`<span class="stat-item"><span class="stat-num">${archiveState.reportCount}</span>개 리포트 누적</span>`);
  }
  if (archiveState.articleCount !== null) {
    parts.push(`<span class="stat-item"><span class="stat-num">${archiveState.articleCount.toLocaleString()}</span>건 누적 분석</span>`);
  }
  el.innerHTML = parts.join('<span class="stat-sep">·</span>');
}

/* ── Report loader ── */
const REPO_RAW   = "https://raw.githubusercontent.com/jaehongbr-Coding/us-residential-v2/main";
const REPO_API   = "https://api.github.com/repos/jaehongbr-Coding/us-residential-v2/contents/reports";
const PERIOD_KO  = { weekly: "주간", monthly: "월간", quarterly: "분기", "semi-annual": "반기" };
const docxFiles  = new Set();

async function loadReportList() {
  const sel    = document.getElementById("reportSelect");
  const status = document.getElementById("reportStatus");
  try {
    const res  = await fetch(REPO_API);
    if (!res.ok) throw new Error("목록 조회 실패");
    const files = await res.json();
    files.filter(f => f.name.endsWith(".docx")).forEach(f => docxFiles.add(f.name));
    const mds   = files.filter(f => f.name.endsWith(".md")).sort((a, b) => b.name.localeCompare(a.name));
    if (!mds.length) { status.textContent = "리포트 없음"; return; }

    // 월별 그룹핑: 파일명 예: 20260610_weekly.md → 2026-06-10 주간, "2026년 6월" 그룹에 포함
    const groups = new Map(); // "YYYY-MM" -> { label, items: [{name, text}] }
    mds.forEach(f => {
      const m = f.name.match(/^(\d{4})(\d{2})(\d{2})_(.+)\.md$/);
      const key   = m ? `${m[1]}-${m[2]}` : "기타";
      const label = m ? `${m[1]}년 ${parseInt(m[2], 10)}월` : "기타";
      if (!groups.has(key)) groups.set(key, { label, items: [] });
      groups.get(key).items.push({
        name: f.name,
        text: m ? `${m[1]}-${m[2]}-${m[3]} ${PERIOD_KO[m[4]] || m[4]}` : f.name,
      });
    });
    groups.forEach(g => {
      const optgroup = document.createElement("optgroup");
      optgroup.label = `${g.label} (${g.items.length}건)`;
      g.items.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.name;
        opt.textContent = item.text;
        optgroup.appendChild(opt);
      });
      sel.appendChild(optgroup);
    });

    status.textContent = `${mds.length}개 리포트`;
    archiveState.reportCount = mds.length;
    updateArchiveStats();
  } catch (e) {
    status.textContent = "목록 로드 실패";
  }
}

async function loadSelectedReport() {
  const sel     = document.getElementById("reportSelect");
  const content = document.getElementById("reportContent");
  const docxBtn = document.getElementById("reportDocxBtn");
  const fname   = sel.value;

  // 버튼 초기화
  docxBtn.style.display = "none";

  if (!fname) { content.innerHTML = '<p style="color:#aaa;font-size:13px">리포트를 선택하세요.</p>'; return; }
  content.innerHTML = '<p style="color:#aaa;font-size:13px">불러오는 중...</p>';
  try {
    const res = await fetch(`${REPO_RAW}/reports/${fname}`);
    if (!res.ok) throw new Error("파일 로드 실패");
    const text = await res.text();
    let html;
    if (typeof marked !== 'undefined') {
      html = marked.parse(text);
    } else {
      html = '<p>리포트 로딩 중 오류가 발생했습니다. 새로고침해주세요.</p><pre>' +
             text.replace(/</g, '&lt;') + '</pre>';
    }
    content.innerHTML = html;

    // docx 버튼: 파일 목록에서 존재 여부 즉시 확인
    const docxName = fname.replace(/\.md$/, ".docx");
    const docxUrl  = `${REPO_RAW}/reports/${docxName}`;
    docxBtn.href          = docxUrl;
    docxBtn.download      = docxName;
    docxBtn.style.display = "inline-block";
    if (docxFiles.has(docxName)) {
      docxBtn.style.opacity = "1";
      docxBtn.style.pointerEvents = "auto";
      docxBtn.title = "";
    } else {
      docxBtn.style.opacity = "0.5";
      docxBtn.style.pointerEvents = "none";
      docxBtn.title = "Word 파일이 아직 생성되지 않았습니다";
    }
  } catch (e) {
    content.innerHTML = `<p style="color:#c00">로드 실패: ${e.message}</p>`;
  }
}

document.getElementById("reportSelect").addEventListener("change", loadSelectedReport);

  document.getElementById("popTitle").textContent   = r.title || "";
  document.getElementById("popMeta").textContent    =
    `${r.published_at ? r.published_at.slice(0, 10) : ""}  |  ${r.sector || ""}  |  ${r.event_tags || ""}`;
  document.getElementById("popSummary").textContent =
    r.korean_summary || r.claude_rationale || "(요약 없음)";
  document.getElementById("popOriginalLink").href   = r.url || "#";
  document.getElementById("articleOverlay").classList.add("open");
}

function closeArticlePopup() {
  document.getElementById("articleOverlay").classList.remove("open");
}

});
