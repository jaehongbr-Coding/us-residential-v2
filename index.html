<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Brief — Woomi Global</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B3A5C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Brief">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
          onerror="console.error('marked.js 로드 실패')"></script>
  <script>
    if (typeof Chart === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" onerror="console.error(\'Chart.js 로드 실패\')"><\/script>');
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #333;
      font-size: 14px;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      padding: 20px 24px;
      min-width: 0;
    }

    /* ── App header (The Brief) ── */
    .app-header { text-align: center; padding: 16px 0 8px; border-bottom: 2px solid #1B3A5C; margin-bottom: 20px; }
    .app-header-meta { font-size: 10px; letter-spacing: 2px; color: #888; margin-bottom: 6px; }
    .app-header-rule { height: 2px; background: #1B3A5C; margin: 6px 0; }
    .app-header-title { display: flex; align-items: baseline; justify-content: center; gap: 10px; }
    .app-header-the { font-size: 18px; font-weight: 500; letter-spacing: 5px; color: #1B3A5C; font-family: sans-serif; }
    .app-header-brief { font-size: 48px; font-weight: 700; color: #1B3A5C; font-family: Georgia, serif; line-height: 1; }
    .app-header-date { font-size: 10px; color: #888; margin-top: 4px; }

    /* ── Section ── */
    .section { margin-bottom: 28px; }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid #eee;
    }

    /* ── Page tabs (뉴스 / 인텔리전스) ── */
    .page-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
    }
    .page-tab-btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: none;
      cursor: pointer;
      color: #888;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .page-tab-btn:hover { color: #1B3A5C; }
    .page-tab-btn.active { color: #1B3A5C; border-bottom-color: #1B3A5C; }
    .page-panel { display: none; }
    .page-panel.active { display: block; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 1px solid #ddd; }
    .tab-btn {
      padding: 7px 14px;
      font-size: 12px;
      border: none;
      background: none;
      cursor: pointer;
      color: #666;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #333; }
    .tab-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Scroll box ── */
    .scroll-box {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    .scroll-inner {
      overflow-y: auto;
      overflow-x: auto;
    }
    .scroll-inner.h-400 { max-height: 400px; }
    .scroll-inner.h-500 { max-height: 500px; }
    .scroll-inner.h-600 { max-height: 600px; }

    /* ── Table ── */
    .tbl-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    thead tr { border-bottom: 1px solid #ddd; }
    thead th {
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 2;
      box-shadow: 0 1px 0 #ddd;
    }
    th {
      padding: 5px 6px;
      font-size: 11px;
      font-weight: 600;
      text-align: left;
      color: #555;
      white-space: nowrap;
    }
    td {
      padding: 4px 6px;
      font-size: 12px;
      vertical-align: top;
      border-bottom: 1px solid #f0f0f0;
    }
    tr:hover td { background: #fafafa; }

    .col-date      { width: 48px; white-space: nowrap; color: #888; font-size: 11px; }
    .col-title     { width: 35%; }
    .col-sector    { width: 80px; color: #555; font-size: 11px; }
    .col-tags      { width: 110px; color: #666; font-size: 11px; word-break: break-word; }
    .col-rationale { color: #666; font-size: 11px; word-break: break-word; }
    .col-region    { width: 70px; color: #555; font-size: 11px; }
    .col-rel       { width: 50px; color: #555; font-size: 11px; text-align: center; }

    /* ── Archive filters (chips) ── */
    .archive-filter-group { margin-bottom: 14px; }
    .archive-filter-label { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 6px; }
    .archive-filter-row { display: flex; align-items: center; gap: 8px; }
    .archive-filter-row input[type="date"],
    .archive-filter-row input[type="text"] {
      padding: 6px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px;
    }
    .archive-filter-row input[type="text"] { flex: 1; }
    .chip-box { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip-box-scroll { max-height: 120px; overflow-y: auto; padding: 6px; border: 1px solid #eee; border-radius: 8px; }
    .chip {
      padding: 5px 10px; font-size: 12px; border: 1px solid #ddd; border-radius: 14px;
      background: #fff; color: #555; cursor: pointer; white-space: nowrap;
    }
    .chip:hover { border-color: #1a73e8; }
    .chip.active { background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: 600; }
    .archive-filter-actions { margin-bottom: 16px; }
    .archive-clear-btn, .archive-more-btn {
      padding: 6px 14px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px;
      background: #fff; color: #555; cursor: pointer;
    }
    .archive-clear-btn:hover, .archive-more-btn:hover { border-color: #1a73e8; color: #1a73e8; }
    .archive-result-header { font-size: 16px; font-weight: 700; color: #1B3A5C; margin: 14px 0 6px; }
    .archive-zero-hint { font-size: 12px; color: #999; margin-bottom: 10px; }
    .archive-zero-hint ul { margin: 6px 0 0 18px; }
    .archive-sort-row { font-size: 12px; color: #666; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .archive-sort-row select { padding: 4px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }

    .title-link {
      color: #1a73e8;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.4;
    }
    .title-link:hover { text-decoration: underline; }
    .star { color: #f4b400; }

    .empty-msg { font-size: 13px; color: #999; padding: 12px 4px; }

    .sh-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; margin-bottom: 10px; }

    /* ── Spinner ── */
    #spinner, #archiveSpinner {
      display: flex; align-items: center; justify-content: center;
      padding: 60px; color: #999; font-size: 14px; gap: 10px;
    }
    .spin {
      width: 20px; height: 20px;
      border: 3px solid #ddd;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .main { padding: 12px 14px; }
      .app-header-brief { font-size: 36px; }
      .col-sector, .col-tags { display: none; }
      .col-rationale { width: 140px; }
      .chip-box-scroll { max-height: 96px; }
    }

    /* 데스크톱: 기사 테이블 좌우에 스크롤 잡을 여백 확보 */
    @media (min-width: 769px) {
      #page-news .scroll-box { margin: 0 4%; }
    }

    /* 모바일: 리스트 박스가 화면을 꽉 채우면 세로 스와이프가 리스트 내부 스크롤에 먹혀
       페이지 전체 스크롤이 잘 안 되는 문제 — 데스크톱과 별개 미디어쿼리로 값 독립 조정 가능 */
    @media (max-width: 768px) {
      #page-news .scroll-box { margin: 0 4%; }
    }

    /* ── Trend section ── */
    .trend-charts { display: flex; flex-direction: column; gap: 20px; }
    .trend-chart-box {
      background: #fff;
      border: 1px solid #1B3A5C;
      border-radius: 8px;
      padding: 14px 16px;
    }
    .trend-chart-title { font-size: 13px; font-weight: 600; color: #1B3A5C; margin-bottom: 10px; }
    .trend-chart-canvas-wrap { position: relative; height: 200px; }
    .trend-footnote { font-size: 11px; color: #999; margin-top: 10px; text-align: right; }

    /* ── Report archive stats ── */
    .archive-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      align-items: center;
      background: #f2f6fa;
      border: 1px solid #dce6ef;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 12px;
      color: #1B3A5C;
    }
    .archive-stats .stat-item { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
    .archive-stats .stat-num  { font-size: 15px; font-weight: 700; }
    .archive-stats .stat-sep  { color: #b8c7d6; }

    /* ── Report section ── */
    #reportContent h2 { font-size: 16px; font-weight: 700; margin: 18px 0 6px; color: #222; }
    #reportContent h3 { font-size: 14px; font-weight: 600; margin: 14px 0 4px; color: #333; }
    #reportContent ul  { padding-left: 18px; margin: 4px 0 10px; }
    #reportContent li  { margin-bottom: 4px; line-height: 1.6; }
    #reportContent p   { margin: 6px 0; }
    #reportContent hr  { border: none; border-top: 1px solid #ddd; margin: 14px 0; }
    #reportContent pre { background: #f5f5f5; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto; }

    /* ── Article popup ── */
    #articleOverlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #articleOverlay.open { display: flex; }
    #articlePopup {
      background: #fff;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    #articlePopup .pop-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    #articlePopup .pop-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 14px;
    }
    #articlePopup hr { border: none; border-top: 1px solid #eee; margin: 14px 0; }
    #articlePopup .pop-summary {
      font-size: 13px;
      line-height: 1.8;
      color: #333;
      white-space: pre-wrap;
    }
    #articlePopup .pop-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    #articlePopup .pop-actions a, #articlePopup .pop-actions button {
      padding: 7px 16px;
      border-radius: 5px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      text-decoration: none;
    }
    #popOriginalLink {
      background: #1a73e8;
      color: #fff;
    }
    #popClose {
      background: #f0f0f0;
      color: #333;
    }
  </style>
</head>
<body>

<!-- 기사 국문 요약 팝업 -->
<div id="articleOverlay" onclick="if(event.target===this)closeArticlePopup()">
  <div id="articlePopup">
    <div class="pop-title" id="popTitle"></div>
    <div class="pop-meta" id="popMeta"></div>
    <hr />
    <div class="pop-summary" id="popSummary"></div>
    <div class="pop-actions">
      <a id="popOriginalLink" href="#" target="_blank" rel="noopener">원문 보기 →</a>
      <button id="popClose" onclick="closeArticlePopup()">닫기</button>
    </div>
  </div>
</div>

<div class="layout">

  <!-- ── Main ── -->
  <main class="main">

    <div class="app-header">
      <div class="app-header-meta">우미글로벌 해외사업팀 | 미국 주거시장 인텔리전스</div>
      <div class="app-header-rule"></div>
      <div class="app-header-title">
        <span class="app-header-the">THE</span>
        <span class="app-header-brief">Brief</span>
      </div>
      <div class="app-header-rule"></div>
      <div class="app-header-date" id="headerDate"></div>
    </div>

    <div class="page-tabs">
      <button class="page-tab-btn active" data-page="page-news" onclick="switchPage(this)">📰 뉴스</button>
      <button class="page-tab-btn" data-page="page-intel" onclick="switchPage(this)">📊 인텔리전스</button>
      <button class="page-tab-btn" data-page="page-archive" onclick="switchPage(this)">🗄️ 아카이브</button>
    </div>

    <div id="page-news" class="page-panel active">
    <div id="spinner"><div class="spin"></div> 데이터 로딩 중...</div>
    <div id="app" style="display:none">

      <!-- 🎯 핵심 모니터링 -->
      <div class="section">
        <div class="section-title" id="highTitle">🎯 핵심 모니터링</div>
        <div class="scroll-box"><div class="scroll-inner h-400 tbl-wrap" id="highTable"></div></div>
      </div>

      <hr style="border:none;border-top:1px solid #eee;margin-bottom:24px" />

      <!-- 📡 전략 신호 모니터 -->
      <div class="section">
        <div class="section-title">📡 전략 신호 모니터</div>
        <div class="tabs" id="signalTabs">
          <button class="tab-btn active" data-tab="tab-residential" onclick="switchTab(this)">🏗️ 개발 동향</button>
          <button class="tab-btn" data-tab="tab-cap" onclick="switchTab(this)">📊 시장·금리</button>
          <button class="tab-btn" data-tab="tab-gp" onclick="switchTab(this)">🤝 GP·거래 동향</button>
          <button class="tab-btn" data-tab="tab-sh" onclick="switchTab(this)">🎓 Student Housing</button>
        </div>
        <div class="tab-panel active" id="tab-residential"><div class="scroll-box"><div class="scroll-inner h-500 tbl-wrap"></div></div></div>
        <div class="tab-panel" id="tab-cap"><div class="scroll-box"><div class="scroll-inner h-500 tbl-wrap"></div></div></div>
        <div class="tab-panel" id="tab-gp"><div class="scroll-box"><div class="scroll-inner h-500 tbl-wrap"></div></div></div>
        <div class="tab-panel" id="tab-sh">
          <div class="sh-toggle">
            <input type="checkbox" id="shLow" onchange="render()" />
            <label for="shLow">낮음 기사 포함</label>
          </div>
          <div class="scroll-box"><div class="scroll-inner h-500 tbl-wrap"></div></div>
        </div>
      </div>

      <hr style="border:none;border-top:1px solid #eee;margin-bottom:24px" />

      <!-- 전체 기사 -->
      <div class="section">
        <div class="section-title" id="allTitle">전체 기사</div>
        <div style="margin-bottom:10px;display:flex;align-items:center;gap:8px;">
          <span style="font-size:16px;">🔍</span>
          <input type="text" id="searchInput" placeholder="기사 검색 (제목·요약·분류근거)"
            style="flex:1;padding:7px 10px;font-size:13px;border:1px solid #ccc;border-radius:6px;" />
        </div>
        <div class="scroll-box"><div class="scroll-inner h-600 tbl-wrap" id="allTable"></div></div>
      </div>

    </div><!-- #app -->
    </div><!-- #page-news -->

    <div id="page-intel" class="page-panel">
    <!-- 📈 시장 트렌드 분석 (CSV 로딩 성공 여부와 무관하게 항상 표시 — 하드코딩 데이터) -->
    <div class="section">
      <div class="section-title">📈 시장 트렌드 분석</div>
      <div class="trend-charts">
        <div class="trend-chart-box">
          <div class="trend-chart-title">월별 수집 기사 카테고리 분포</div>
          <div class="trend-chart-canvas-wrap"><canvas id="trendCategoryChart"></canvas></div>
        </div>
        <div class="trend-chart-box">
          <div class="trend-chart-title">핵심 모니터링 선별 비율 추이</div>
          <div class="trend-chart-canvas-wrap"><canvas id="trendHighRatioChart"></canvas></div>
        </div>
        <div class="trend-chart-box">
          <div class="trend-chart-title">주요 GP 언급 빈도 추이</div>
          <div class="trend-chart-canvas-wrap"><canvas id="trendGpChart"></canvas></div>
        </div>
      </div>
      <div class="trend-footnote">데이터 기준: 2026.03~08.18, 총 5,272건</div>
    </div>

    <hr style="border:none;border-top:1px solid #eee;margin-bottom:24px" />

    <div id="app2" style="display:none">
      <!-- 📋 인텔리전스 리포트 -->
      <div class="section">
        <div class="section-title">📋 인텔리전스 리포트</div>
        <div id="archiveStats" class="archive-stats"></div>
        <div style="margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <select id="reportSelect" style="padding:6px 10px;font-size:13px;border:1px solid #ccc;border-radius:4px;min-width:240px">
            <option value="">-- 리포트 선택 --</option>
          </select>
          <a id="reportDocxBtn" href="#" download
            style="display:none;padding:6px 12px;font-size:12px;background:#1a73e8;color:#fff;
                   border-radius:4px;text-decoration:none;white-space:nowrap">
            ⬇️ Word 다운로드
          </a>
          <span id="reportStatus" style="font-size:12px;color:#999"></span>
        </div>
        <div id="reportContent"
          style="border:1px solid #e0e0e0;border-radius:8px;padding:20px 24px;min-height:80px;
                 font-size:14px;line-height:1.7;color:#333;background:#fafafa">
          <p style="color:#aaa;font-size:13px">아직 생성된 리포트가 없습니다.</p>
        </div>
      </div>

    </div><!-- #app2 -->
    </div><!-- #page-intel -->

    <div id="page-archive" class="page-panel">
      <div id="archiveSpinner"><div class="spin"></div> 아카이브 로딩 중...</div>
      <div id="archiveApp" style="display:none">
        <div class="section">
          <div class="section-title">🗄️ 아카이브 검색</div>

          <div class="archive-filter-group">
            <div class="archive-filter-label">섹터</div>
            <div class="chip-box" id="chipSector"></div>
          </div>
          <div class="archive-filter-group">
            <div class="archive-filter-label">주(State)</div>
            <div class="chip-box chip-box-scroll" id="chipState"></div>
          </div>
          <div class="archive-filter-group">
            <div class="archive-filter-label">이벤트 태그</div>
            <div class="chip-box chip-box-scroll" id="chipEventTag"></div>
          </div>
          <div class="archive-filter-group">
            <div class="archive-filter-label">관련성</div>
            <div class="chip-box" id="chipRelevance"></div>
          </div>
          <div class="archive-filter-group">
            <div class="archive-filter-label">카테고리</div>
            <div class="chip-box" id="chipCategory"></div>
          </div>
          <div class="archive-filter-group archive-filter-row">
            <div class="archive-filter-label">기간</div>
            <input type="date" id="archiveFromDate" onchange="onArchiveFilterChange()" />
            <span>~</span>
            <input type="date" id="archiveToDate" onchange="onArchiveFilterChange()" />
          </div>
          <div class="archive-filter-group archive-filter-row">
            <span style="font-size:16px;">🔍</span>
            <input type="text" id="archiveSearchInput" placeholder="제목·소스 검색" oninput="onArchiveFilterChange()" />
          </div>
          <div class="archive-filter-actions">
            <button type="button" class="archive-clear-btn" onclick="clearArchiveFilters()">필터 초기화</button>
          </div>

          <div id="archiveResultHeader" class="archive-result-header"></div>
          <div id="archiveZeroHint" class="archive-zero-hint" style="display:none"></div>

          <div class="archive-sort-row">
            정렬:
            <select id="archiveSortSelect" onchange="onArchiveFilterChange()">
              <option value="date_desc">최신순</option>
              <option value="relevance">관련성순</option>
            </select>
          </div>

          <div class="scroll-box"><div class="scroll-inner h-600 tbl-wrap" id="archiveTable"></div></div>
          <div id="archiveMoreWrap" style="text-align:center;margin-top:10px;display:none">
            <button type="button" class="archive-more-btn" onclick="showMoreArchiveResults()">더 보기</button>
          </div>
        </div>
      </div><!-- #archiveApp -->
    </div><!-- #page-archive -->
  </main>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/jaehongbr-Coding/us-residential-v2/main/articles.csv";
let allRows = [];

// Player 소스(기업명 기반 수집, lookback 최대 730일)는 published_at이 기존
// 관측창보다 20개월 앞선 기사를 포함한다. 원장에는 유지하되 일상 브리핑(핵심
// 모니터링·전략 신호 모니터)에는 노출하지 않는다 — 아카이브 용도이지 최근
// 동향 파악용이 아니기 때문. CLAUDE.md "수집 구조 정정" 절 참조.
// 예외: 누적 지표 헤더(archiveState, 축적량 표시)와 검색(전체 기사, Deal Ledger
// 검색의 전신)은 의도적으로 Player를 포함한다 — 아래에서 제외 처리하지 않는다.
const PLAYER_SOURCE_PREFIX = "Player — ";

/* ── Helpers ── */
function getLatestDateRange(rows) {
  const dates = rows
    .map(r => r.published_at ? r.published_at.slice(0, 10) : null)
    .filter(Boolean)
    .sort()
    .reverse();
  if (!dates.length) return { from: null, to: null };
  const latest = dates[0];
  const latestDate = new Date(latest);
  latestDate.setDate(latestDate.getDate() - 1);
  const from = latestDate.toISOString().slice(0, 10);
  return { from, to: latest };
}

function fmtDate(str) {
  if (!str) return "";
  const d = new Date(str);
  if (isNaN(d)) return "";
  return (d.getMonth() + 1).toString().padStart(2, "0") + "-" + d.getDate().toString().padStart(2, "0");
}

function parseDate(str) {
  if (!str) return null;
  const d = new Date(str);
  return isNaN(d) ? null : d;
}

function truncate(s, n) {
  if (!s) return "";
  return s.length > n ? s.slice(0, n) + "…" : s;
}

function hasTag(tags, ...keywords) {
  const t = (tags || "").toLowerCase();
  return keywords.some(k => t.includes(k));
}

/* ── Table builder ── */
function buildTable(rows, maxHeight = null) {
  if (!rows.length) return '<p class="empty-msg">관련 기사 없음</p>';
  const sorted = [...rows].sort((a, b) => {
    const da = parseDate(a.published_at), db = parseDate(b.published_at);
    if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
    return db - da;
  });
  const trs = sorted.map(r => {
    const star = r.woomi_relevance === "높음" ? '<span class="star">⭐ </span>' : "";
    const lock = r.access_limited === "True" ? "🔒 " : "";
    const idx  = allRows.indexOf(r);
    return `<tr>
      <td class="col-date">${fmtDate(r.published_at)}</td>
      <td class="col-title">
        <a class="title-link" href="#" onclick="openArticlePopup(${idx});return false;">
          ${star}${lock}${escHtml(r.title)}
        </a>
      </td>
      <td class="col-sector">${escHtml(r.sector)}</td>
      <td class="col-tags">${escHtml(r.event_tags)}</td>
      <td class="col-rationale">${escHtml(truncate(r.claude_rationale, 120))}</td>
    </tr>`;
  }).join("");
  return `<table>
    <thead><tr>
      <th class="col-date">날짜</th>
      <th class="col-title">제목</th>
      <th class="col-sector">섹터</th>
      <th class="col-tags">태그</th>
      <th class="col-rationale">분류근거</th>
    </tr></thead>
    <tbody>${trs}</tbody>
  </table>`;
  if (!maxHeight) return tableHtml;
  return `<div style="max-height:${maxHeight}px;overflow-y:auto;border:1px solid #e0e0e0;border-radius:8px;">${tableHtml}</div>`;
}

function escHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* ── Filter logic (유료 기사는 항상 숨김) ── */
function applyBaseFilters(rows) {
  return rows.filter(r => String(r.access_limited).toLowerCase() !== "true");
}

/* ── Render ── */
function render() {
  // Base filtered (유료 기사 숨김)
  const base = applyBaseFilters(allRows);

  // 전체 기사 기준 최신 날짜 범위 (핵심 모니터링 + 전략 신호 공용)
  const { from: latestFrom, to: latestTo } = getLatestDateRange(allRows);

  // ⭐ 핵심 모니터링 (전체 기사 최신 날짜 기준 2일치, 높음=0건이면 3일치로 확장)
  const highRows = (() => {
    // 1. 기본 필터 — 전체 기사 최신 날짜 기준
    const candidates = allRows.filter(r => {
      if (r.source && r.source.startsWith(PLAYER_SOURCE_PREFIX)) return false;
      if (r.access_limited === "True") return false;
      if (r.woomi_relevance !== "높음") return false;
      const d = r.published_at ? r.published_at.slice(0, 10) : null;
      if (!d || d < latestFrom) return false;
      return true;
    }).sort((a, b) => {
      const da = parseDate(a.published_at), db = parseDate(b.published_at);
      if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
      return db - da;
    });

    // 2. 전체 중복 제거 (날짜 무관, 고유명사 2개 이상 겹치면 중복)
    function isDup(a, b) {
      const properA = (a.title || "").split(/\s+/).filter(w => /^[A-Z]/.test(w) && w.length > 3);
      const properB = new Set((b.title || "").split(/\s+/).filter(w => /^[A-Z]/.test(w) && w.length > 3));
      return properA.filter(w => properB.has(w)).length >= 2;
    }
    let deduped = candidates.reduce((acc, r) => {
      if (!acc.some(a => isDup(a, r))) acc.push(r);
      return acc;
    }, []);

    // 3. 높음 0건이면 3일치로 확장
    if (!deduped.length) {
      const extDate = new Date(latestTo);
      extDate.setDate(extDate.getDate() - 2);
      const extFrom = extDate.toISOString().slice(0, 10);
      const ext = allRows.filter(r => {
        if (r.source && r.source.startsWith(PLAYER_SOURCE_PREFIX)) return false;
        if (r.access_limited === "True") return false;
        if (r.woomi_relevance !== "높음") return false;
        const d = r.published_at ? r.published_at.slice(0, 10) : null;
        return d && d >= extFrom;
      });
      deduped = ext.reduce((acc, r) => {
        if (!acc.some(a => isDup(a, r))) acc.push(r);
        return acc;
      }, []);
    }

    // 4. SH 캡 5건
    const nonSh = deduped.filter(r => r.sector !== "Student Housing");
    const sh    = deduped.filter(r => r.sector === "Student Housing");
    return [...nonSh, ...sh.slice(0, 5)];
  })();
  document.getElementById("highTitle").textContent = `🎯 핵심 모니터링 (${highRows.length}건)`;
  document.getElementById("highTable").innerHTML = buildTable(highRows, 400);

  // 전략 신호 — 전체 기사 최신 날짜 기준 2일치 (latestFrom 공용)
  const signalBase = allRows.filter(r => {
    if (r.source && r.source.startsWith(PLAYER_SOURCE_PREFIX)) return false;
    if (r.access_limited === "True") return false;
    const d = r.published_at ? r.published_at.slice(0, 10) : null;
    if (!d || (latestFrom && d < latestFrom)) return false;
    return true;
  });

  const RESIDENTIAL_SECTORS = ["BTR", "SFR", "Multifamily", "Workforce Housing", "Affordable Housing"];
  const residential = signalBase.filter(r =>
    r.category === "개발" ||
    hasTag(r.event_tags, "construction_start", "permit", "land_acquisition", "delivery")
  );
  const cap = signalBase.filter(r =>
    r.category === "시장" && (
      hasTag(r.event_tags, "financing", "policy", "market_data", "rent_occupancy") ||
      r.source === "Federal Reserve"
    )
  );
  const gp = signalBase.filter(r =>
    r.category === "GP·자본흐름" &&
    hasTag(r.event_tags, "transaction", "acquisition", "jv")
  );
  const showLow = document.getElementById("shLow").checked;
  const sh = signalBase.filter(r =>
    r.sector === "Student Housing" && (showLow || r.woomi_relevance !== "낮음")
  );

  // Update tab labels (건수 = buildTable에 전달되는 실제 rows.length)
  const tabBtns = document.querySelectorAll("#signalTabs .tab-btn");
  tabBtns[0].textContent = `🏗️ 개발 동향 (${residential.length}건)`;
  tabBtns[1].textContent = `📊 시장·금리 (${cap.length}건)`;
  tabBtns[2].textContent = `🤝 GP·거래 동향 (${gp.length}건)`;
  tabBtns[3].textContent = `🎓 Student Housing (${sh.length}건)`;

  document.querySelector("#tab-residential .tbl-wrap").innerHTML = buildTable(residential, 500);
  document.querySelector("#tab-cap .tbl-wrap").innerHTML         = buildTable(cap, 500);
  document.querySelector("#tab-gp .tbl-wrap").innerHTML          = buildTable(gp, 500);
  document.querySelector("#tab-sh .tbl-wrap").innerHTML          = buildTable(sh, 500);

  // 전체 기사 — 유료 기사 숨김 + 검색어 AND
  const searchQ = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  const baseFiltered = searchQ
    ? base.filter(r =>
        (r.title || "").toLowerCase().includes(searchQ) ||
        (r.summary || "").toLowerCase().includes(searchQ) ||
        (r.claude_rationale || "").toLowerCase().includes(searchQ)
      )
    : base;
  document.getElementById("allTitle").textContent = `전체 기사 (${baseFiltered.length}건)`;
  document.getElementById("allTable").innerHTML = buildTable(baseFiltered, 600);
}

/* ── Trend charts (하드코딩 데이터, articles.csv 실시간 연동 아님) ── */

        { label: 'Core Spaces',    data: [1, 3, 4, 12, 18, 6], borderColor: '#3CA05A', backgroundColor: '#3CA05A', tension: 0.3 },
        { label: 'Greystar',       data: [0, 1, 3, 8, 14, 5],  borderColor: '#C0392B', backgroundColor: '#C0392B', tension: 0.3 },
        { label: 'Kennedy Wilson', data: [0, 1, 2, 5, 9, 4],   borderColor: '#8E44AD', backgroundColor: '#8E44AD', tension: 0.3 },
      ],
    },
    options: {

/* ── Tab switching ── */
function switchTab(btn) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(btn.dataset.tab).classList.add("active");
}

/* ── Page switching (📰 뉴스 / 📊 인텔리전스) ── */
let intelLoaded = false;
function switchPage(btn) {
  document.querySelectorAll(".page-tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".page-panel").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(btn.dataset.page).classList.add("active");

  // 인텔리전스 탭은 처음 열 때만 트렌드 차트·리포트 목록을 지연 로딩
  if (btn.dataset.page === "page-intel" && !intelLoaded) {
    intelLoaded = true;
    if (typeof Chart !== 'undefined') {
      renderTrendCharts();
    } else {
      console.error('Chart.js 로드 실패');
    }
    loadReportList();
  } else if (btn.dataset.page === "page-archive") {
    // loadArchiveData() 내부에서 archiveLoaded 플래그로 최초 1회만 fetch한다.
    loadArchiveData();
  }
}

/* ── Archive stats (누적 지표 헤더) ── */
const archiveState = { reportCount: null, earliestDate: null, articleCount: null };

function updateArchiveStats() {
  const el = document.getElementById("archiveStats");
  if (!el) return;
  const parts = [];
  if (archiveState.earliestDate) {
    const days  = Math.floor((new Date() - new Date(archiveState.earliestDate)) / 86400000);
    const weeks = Math.max(1, Math.floor(days / 7));
    parts.push(`<span class="stat-item"><span class="stat-num">${weeks}</span>주 연속 수집</span>`);
  }
  if (archiveState.reportCount !== null) {
    parts.push(`<span class="stat-item"><span class="stat-num">${archiveState.reportCount}</span>개 리포트 누적</span>`);
  }
  if (archiveState.articleCount !== null) {
    parts.push(`<span class="stat-item"><span class="stat-num">${archiveState.articleCount.toLocaleString()}</span>건 누적 분석</span>`);
  }
  el.innerHTML = parts.join('<span class="stat-sep">·</span>');
}

/* ══════════════════════════════════════════════════════════
   Archive search (🗄️ 아카이브) — archive_index.json 소비.
   articles.csv(allRows)와 완전히 별개인 데이터 흐름이다. 레코드
   단축키(id/d/s/t/u/sec/cat/ev/rel/ks/cbsa/st/sc/gc)를 그대로 쓰고
   변환 레이어를 두지 않는다.
   Player 소스를 의도적으로 포함한다 — AA 213건이 전량 Player
   소스라 제외하면 이 화면을 만든 이유가 없어진다. "전체 기사"
   검색이 같은 이유로 Player를 포함하는 것과 일관된 판단이다.
   핵심 모니터링·전략 신호 모니터의 PLAYER_SOURCE_PREFIX 제외
   로직은 여기서 건드리지 않는다(별개 섹션, 별개 데이터).
   ══════════════════════════════════════════════════════════ */
const ARCHIVE_INDEX_URL = "https://raw.githubusercontent.com/jaehongbr-Coding/us-residential-v2/main/archive_index.json";
let archiveData = null;     // fetch 1회, 이후 전역 보관 — 탭 재방문 시 재요청 안 함
let archiveLoaded = false;  // 아카이브 탭 최초 클릭(또는 해시 진입) 시에만 true
let archiveRenderLimit = 200; // 7,427건을 한 번에 그리지 않는다 — "더 보기"로 증가

const archiveFilters = {
  sec: new Set(), st: new Set(), ev: new Set(), rel: new Set(), cat: new Set(),
  fromDate: "", toDate: "", text: "",
};

function loadArchiveData() {
  if (archiveLoaded) return;
  archiveLoaded = true;
  fetch(ARCHIVE_INDEX_URL)
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then(data => {
      archiveData = data;
      document.getElementById("archiveSpinner").style.display = "none";
      document.getElementById("archiveApp").style.display = "block";
      restoreArchiveFiltersFromHash();
      renderArchiveChips();
      renderArchive();
    })
    .catch(err => {
      document.getElementById("archiveSpinner").innerHTML =
        `<span style="color:#c00">아카이브 로드 실패: ${err.message}</span>`;
    });
}

function renderArchiveChips() {
  const chipDefs = [
    { id: "chipSector",   key: "sec", source: archiveData.filters.sectors },
    { id: "chipState",    key: "st",  source: archiveData.filters.states },
    { id: "chipEventTag", key: "ev",  source: archiveData.filters.event_tags },
    { id: "chipCategory", key: "cat", source: archiveData.filters.categories },
  ];
  chipDefs.forEach(({ id, key, source }) => {
    document.getElementById(id).innerHTML = source.map(f => {
      const active = archiveFilters[key].has(f.value) ? " active" : "";
      return `<button type="button" class="chip${active}" data-key="${key}" data-value="${escHtml(f.value)}" onclick="toggleArchiveFilter(this)">${escHtml(f.value)} (${f.count})</button>`;
    }).join("");
  });

  // woomi_relevance는 archive_index.json의 filters 블록에 미집계 —
  // 클라이언트에서 직접 카운트한다(geo_scope는 이번 화면에서 미노출).
  const relCounts = {};
  archiveData.records.forEach(r => { relCounts[r.rel] = (relCounts[r.rel] || 0) + 1; });
  const relOrder = ["높음", "보통", "낮음"];
  document.getElementById("chipRelevance").innerHTML = relOrder
    .filter(v => relCounts[v])
    .map(v => {
      const active = archiveFilters.rel.has(v) ? " active" : "";
      return `<button type="button" class="chip${active}" data-key="rel" data-value="${v}" onclick="toggleArchiveFilter(this)">${v} (${relCounts[v]})</button>`;
    }).join("");
}

function toggleArchiveFilter(btn) {
  const key = btn.dataset.key;
  const value = btn.dataset.value;
  const set = archiveFilters[key];
  if (set.has(value)) set.delete(value); else set.add(value);
  btn.classList.toggle("active");
  archiveRenderLimit = 200;
  renderArchive();
}

function onArchiveFilterChange() {
  archiveFilters.fromDate = document.getElementById("archiveFromDate").value || "";
  archiveFilters.toDate   = document.getElementById("archiveToDate").value || "";
  archiveFilters.text     = (document.getElementById("archiveSearchInput").value || "").trim().toLowerCase();
  archiveRenderLimit = 200;
  renderArchive();
}

function clearArchiveFilters() {
  archiveFilters.sec.clear(); archiveFilters.st.clear(); archiveFilters.ev.clear();
  archiveFilters.rel.clear(); archiveFilters.cat.clear();
  archiveFilters.fromDate = ""; archiveFilters.toDate = ""; archiveFilters.text = "";
  document.getElementById("archiveFromDate").value = "";
  document.getElementById("archiveToDate").value = "";
  document.getElementById("archiveSearchInput").value = "";
  archiveRenderLimit = 200;
  renderArchiveChips();
  renderArchive();
}

function showMoreArchiveResults() {
  archiveRenderLimit += 200;
  renderArchive();
}

/* skip: 특정 필터 카테고리 하나를 빼고 판정할 때 쓴다(0건 진단용). */
function passesArchiveFilters(r, skip) {
  if (skip !== "sec" && archiveFilters.sec.size && !archiveFilters.sec.has(r.sec)) return false;
  if (skip !== "st" && archiveFilters.st.size) {
    const states = (r.st || "").split("|").filter(Boolean);
    if (!states.some(s => archiveFilters.st.has(s))) return false;
  }
  if (skip !== "ev" && archiveFilters.ev.size) {
    const tags = (r.ev || "").split(",").map(s => s.trim()).filter(Boolean);
    if (!tags.some(t => archiveFilters.ev.has(t))) return false;
  }
  if (skip !== "rel" && archiveFilters.rel.size && !archiveFilters.rel.has(r.rel)) return false;
  if (skip !== "cat" && archiveFilters.cat.size && !archiveFilters.cat.has(r.cat)) return false;
  if (skip !== "date" && (archiveFilters.fromDate || archiveFilters.toDate)) {
    if (archiveFilters.fromDate && r.d < archiveFilters.fromDate) return false;
    if (archiveFilters.toDate && r.d > archiveFilters.toDate) return false;
  }
  if (skip !== "text" && archiveFilters.text) {
    const hay = `${r.t} ${r.s}`.toLowerCase();
    if (!hay.includes(archiveFilters.text)) return false;
  }
  return true;
}

function hasAnyArchiveFilter() {
  return !!(archiveFilters.sec.size || archiveFilters.st.size || archiveFilters.ev.size ||
    archiveFilters.rel.size || archiveFilters.cat.size || archiveFilters.fromDate ||
    archiveFilters.toDate || archiveFilters.text);
}

function diagnoseZeroArchiveResults() {
  const cats = [
    ["sec", "섹터"], ["st", "주"], ["ev", "이벤트 태그"],
    ["rel", "관련성"], ["cat", "카테고리"], ["date", "기간"], ["text", "텍스트 검색"],
  ];
  const lines = [];
  cats.forEach(([key, label]) => {
    const isActive = key === "date" ? !!(archiveFilters.fromDate || archiveFilters.toDate)
      : key === "text" ? !!archiveFilters.text
      : archiveFilters[key].size > 0;
    if (!isActive) return;
    const countWithout = archiveData.records.filter(r => passesArchiveFilters(r, key)).length;
    lines.push(`<li>"${label}" 필터를 빼면 ${countWithout.toLocaleString()}건</li>`);
  });
  return `<div>0건입니다. 필터를 하나씩 빼보면:</div><ul>${lines.join("")}</ul>`;
}

function buildArchiveTable(rows) {
  if (!rows.length) return '<p class="empty-msg">조건에 맞는 기사가 없습니다</p>';
  const trs = rows.map(r => {
    const star = r.rel === "높음" ? '<span class="star">⭐ </span>' : "";
    const region = (r.st || "").split("|").filter(Boolean).join(", ") || "—";
    return `<tr>
      <td class="col-date">${fmtDate(r.d)}</td>
      <td class="col-title">
        <a class="title-link" href="${escHtml(r.u)}" target="_blank" rel="noopener">
          ${star}${escHtml(r.t)}
        </a>
      </td>
      <td class="col-sector">${escHtml(r.sec)}</td>
      <td class="col-region">${escHtml(region)}</td>
      <td class="col-tags">${escHtml(r.ev)}</td>
      <td class="col-rel">${escHtml(r.rel)}</td>
    </tr>`;
  }).join("");
  return `<table>
    <thead><tr>
      <th class="col-date">날짜</th>
      <th class="col-title">제목</th>
      <th class="col-sector">섹터</th>
      <th class="col-region">지역</th>
      <th class="col-tags">태그</th>
      <th class="col-rel">관련성</th>
    </tr></thead>
    <tbody>${trs}</tbody>
  </table>`;
}

function renderArchive() {
  if (!archiveData) return;
  const filtered = archiveData.records.filter(r => passesArchiveFilters(r, null));

  // 지역 미상 안내 — 주 필터가 걸려 있을 때만, 조용히 빠지는 건수를 표기한다.
  let missingGeoNote = "";
  if (archiveFilters.st.size) {
    const withoutStateFilter = archiveData.records.filter(r => passesArchiveFilters(r, "st"));
    const missingGeo = withoutStateFilter.filter(r => !r.st).length;
    if (missingGeo > 0) {
      missingGeoNote = ` (지역 미상 ${missingGeo.toLocaleString()}건은 주 필터에서 제외됨)`;
    }
  }

  const activeLabels = [];
  [...archiveFilters.sec, ...archiveFilters.st, ...archiveFilters.ev,
   ...archiveFilters.rel, ...archiveFilters.cat].forEach(v => activeLabels.push(v));
  if (archiveFilters.text) activeLabels.push(`"${archiveFilters.text}"`);
  const label = activeLabels.length ? activeLabels.join(" + ") + " — " : "";
  document.getElementById("archiveResultHeader").textContent =
    `${label}${filtered.length.toLocaleString()}건${missingGeoNote}`;

  const zeroHintEl = document.getElementById("archiveZeroHint");
  if (filtered.length === 0 && hasAnyArchiveFilter()) {
    zeroHintEl.innerHTML = diagnoseZeroArchiveResults();
    zeroHintEl.style.display = "block";
  } else {
    zeroHintEl.style.display = "none";
  }

  const sortMode = document.getElementById("archiveSortSelect").value;
  const relOrderMap = { "높음": 0, "보통": 1, "낮음": 2 };
  const sorted = [...filtered].sort((a, b) => {
    if (sortMode === "relevance") {
      const diff = (relOrderMap[a.rel] ?? 3) - (relOrderMap[b.rel] ?? 3);
      if (diff !== 0) return diff;
    }
    return (b.d || "").localeCompare(a.d || "");
  });

  const toRender = sorted.slice(0, archiveRenderLimit);
  document.getElementById("archiveTable").innerHTML = buildArchiveTable(toRender);
  document.getElementById("archiveMoreWrap").style.display =
    sorted.length > toRender.length ? "block" : "none";

  updateArchiveHash();
}

/* ── URL 해시로 필터 상태 보존 (데모용 딥링크) ── */
function updateArchiveHash() {
  const params = [];
  if (archiveFilters.sec.size) params.push("sec=" + [...archiveFilters.sec].map(encodeURIComponent).join(","));
  if (archiveFilters.st.size)  params.push("st="  + [...archiveFilters.st].map(encodeURIComponent).join(","));
  if (archiveFilters.ev.size)  params.push("ev="  + [...archiveFilters.ev].map(encodeURIComponent).join(","));
  if (archiveFilters.rel.size) params.push("rel=" + [...archiveFilters.rel].map(encodeURIComponent).join(","));
  if (archiveFilters.cat.size) params.push("cat=" + [...archiveFilters.cat].map(encodeURIComponent).join(","));
  if (archiveFilters.fromDate) params.push("from=" + archiveFilters.fromDate);
  if (archiveFilters.toDate)   params.push("to="   + archiveFilters.toDate);
  if (archiveFilters.text)     params.push("q="    + encodeURIComponent(archiveFilters.text));
  const hash = params.length ? "#archive?" + params.join("&") : "#archive";
  if (location.hash !== hash) history.replaceState(null, "", hash);
}

function restoreArchiveFiltersFromHash() {
  const hash = location.hash;
  if (!hash.startsWith("#archive")) return;
  const qIdx = hash.indexOf("?");
  if (qIdx === -1) return;
  const params = new URLSearchParams(hash.slice(qIdx + 1));
  ["sec", "st", "ev", "rel", "cat"].forEach(key => {
    const v = params.get(key);
    if (v) v.split(",").forEach(item => archiveFilters[key].add(decodeURIComponent(item)));
  });
  if (params.get("from")) archiveFilters.fromDate = params.get("from");
  if (params.get("to"))   archiveFilters.toDate   = params.get("to");
  if (params.get("q"))    archiveFilters.text     = decodeURIComponent(params.get("q"));

  document.getElementById("archiveFromDate").value   = archiveFilters.fromDate;
  document.getElementById("archiveToDate").value     = archiveFilters.toDate;
  document.getElementById("archiveSearchInput").value = archiveFilters.text;
}

/* ── Load CSV ── */
Papa.parse(CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete({ data }) {
    allRows = data;
    const collectedDates = data
      .map(r => r.collected_at ? r.collected_at.slice(0, 10) : null)
      .filter(Boolean)
      .sort();
    if (collectedDates.length) archiveState.earliestDate = collectedDates[0];
    archiveState.articleCount = data.length;
    updateArchiveStats();
    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("spinner").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("app2").style.display = "block";
    render();
  },
  error(err) {
    document.getElementById("spinner").innerHTML =
      `<span style="color:#c00">데이터 로드 실패: ${err.message}</span>`;
  },
});

// 트렌드 차트·리포트 목록은 인텔리전스 탭을 처음 열 때 switchPage()에서 지연 로딩

/* ── Report loader ── */
const REPO_RAW   = "https://raw.githubusercontent.com/jaehongbr-Coding/us-residential-v2/main";
const REPO_API   = "https://api.github.com/repos/jaehongbr-Coding/us-residential-v2/contents/reports";
const PERIOD_KO  = { weekly: "주간", monthly: "월간", quarterly: "분기", "semi-annual": "반기" };
const docxFiles  = new Set();

async function loadReportList() {
  const sel    = document.getElementById("reportSelect");
  const status = document.getElementById("reportStatus");
  try {
    const res  = await fetch(REPO_API);
    if (!res.ok) throw new Error("목록 조회 실패");
    const files = await res.json();
    files.filter(f => f.name.endsWith(".docx")).forEach(f => docxFiles.add(f.name));
    const mds   = files.filter(f => f.name.endsWith(".md")).sort((a, b) => b.name.localeCompare(a.name));
    if (!mds.length) { status.textContent = "리포트 없음"; return; }

    // 월별 그룹핑: 파일명 예: 20260610_weekly.md → 2026-06-10 주간, "2026년 6월" 그룹에 포함
    const groups = new Map(); // "YYYY-MM" -> { label, items: [{name, text}] }
    mds.forEach(f => {
      const m = f.name.match(/^(\d{4})(\d{2})(\d{2})_(.+)\.md$/);
      const key   = m ? `${m[1]}-${m[2]}` : "기타";
      const label = m ? `${m[1]}년 ${parseInt(m[2], 10)}월` : "기타";
      if (!groups.has(key)) groups.set(key, { label, items: [] });
      groups.get(key).items.push({
        name: f.name,
        text: m ? `${m[1]}-${m[2]}-${m[3]} ${PERIOD_KO[m[4]] || m[4]}` : f.name,
      });
    });
    groups.forEach(g => {
      const optgroup = document.createElement("optgroup");
      optgroup.label = `${g.label} (${g.items.length}건)`;
      g.items.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.name;
        opt.textContent = item.text;
        optgroup.appendChild(opt);
      });
      sel.appendChild(optgroup);
    });

    status.textContent = `${mds.length}개 리포트`;
    archiveState.reportCount = mds.length;
    updateArchiveStats();
  } catch (e) {
    status.textContent = "목록 로드 실패";
  }
}

async function loadSelectedReport() {
  const sel     = document.getElementById("reportSelect");
  const content = document.getElementById("reportContent");
  const docxBtn = document.getElementById("reportDocxBtn");
  const fname   = sel.value;

  // 버튼 초기화
  docxBtn.style.display = "none";

  if (!fname) { content.innerHTML = '<p style="color:#aaa;font-size:13px">리포트를 선택하세요.</p>'; return; }
  content.innerHTML = '<p style="color:#aaa;font-size:13px">불러오는 중...</p>';
  try {
    const res = await fetch(`${REPO_RAW}/reports/${fname}`);
    if (!res.ok) throw new Error("파일 로드 실패");
    const text = await res.text();
    let html;
    if (typeof marked !== 'undefined') {
      html = marked.parse(text);
    } else {
      html = '<p>리포트 로딩 중 오류가 발생했습니다. 새로고침해주세요.</p><pre>' +
             text.replace(/</g, '&lt;') + '</pre>';
    }
    content.innerHTML = html;

    // docx 버튼: 파일 목록에서 존재 여부 즉시 확인
    const docxName = fname.replace(/\.md$/, ".docx");
    const docxUrl  = `${REPO_RAW}/reports/${docxName}`;
    docxBtn.href          = docxUrl;
    docxBtn.download      = docxName;
    docxBtn.style.display = "inline-block";
    if (docxFiles.has(docxName)) {
      docxBtn.style.opacity = "1";
      docxBtn.style.pointerEvents = "auto";
      docxBtn.title = "";
    } else {
      docxBtn.style.opacity = "0.5";
      docxBtn.style.pointerEvents = "none";
      docxBtn.title = "Word 파일이 아직 생성되지 않았습니다";
    }
  } catch (e) {
    content.innerHTML = `<p style="color:#c00">로드 실패: ${e.message}</p>`;
  }
}

document.getElementById("reportSelect").addEventListener("change", loadSelectedReport);
// loadReportList()는 인텔리전스 탭을 처음 열 때 switchPage()에서 호출됨

/* ── Article popup ── */
function openArticlePopup(idx) {
  const r = allRows[idx];
  if (!r) return;
  document.getElementById("popTitle").textContent   = r.title || "";
  document.getElementById("popMeta").textContent    =
    `${r.published_at ? r.published_at.slice(0, 10) : ""}  |  ${r.sector || ""}  |  ${r.event_tags || ""}`;
  document.getElementById("popSummary").textContent =
    r.korean_summary || r.claude_rationale || r.summary || "(요약 없음)";
  document.getElementById("popOriginalLink").href   = r.url || "#";
  document.getElementById("articleOverlay").classList.add("open");
}

function closeArticlePopup() {
  document.getElementById("articleOverlay").classList.remove("open");
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeArticlePopup();
});

document.getElementById('headerDate').textContent =
  new Date().toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric', weekday:'long'});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/us-residential-v2/service-worker.js').then((reg) => {
    // 브라우저 기본 업데이트 체크는 보통 24시간에 한 번만 실행되므로,
    // 앱을 열 때마다 새 버전이 있는지 즉시 한 번 더 확인한다.
    reg.update();
  });

  // skipWaiting()+clients.claim()으로 새 서비스워커가 제어권을 넘겨받아도
  // 이미 열려있는 탭의 화면(HTML/JS)은 자동으로 갱신되지 않으므로,
  // controllerchange(=업데이트 적용 시점)에 한 번만 새로고침한다.
  let swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshed) return; // 무한 새로고침 방지: 세션당 1회만
    swRefreshed = true;
    window.location.reload();
  });
}

// #archive?... 해시로 직접 진입(데모용 딥링크) — 아카이브 탭 클릭과
// 동일한 switchPage() 경로를 그대로 태워 lazy-load 로직을 재사용한다.
if (location.hash.startsWith('#archive')) {
  const archiveBtn = document.querySelector('.page-tab-btn[data-page="page-archive"]');
  if (archiveBtn) switchPage(archiveBtn);
}
