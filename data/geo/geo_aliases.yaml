# 미해결 대학 (CBSA 자동 도출 실패, 추정 금지 — I8)
# 2026.09 Phase 1.5: city_idx 직접 매칭 + title_idx 접두사 매칭(카운티 역참조 대신)
# 둘 다 실패한 건들이다. 대학의 소재 카운티 정보가 BLUE_VISTA_UNIVERSITIES에
# 없어 county_idx는 시도하지 않았다(카운티명 추측 자체가 I8 위반이므로).
# future-me가 수작업으로 채울 때: 카운티명을 확인해 county_idx를 직접 조회하거나,
# 해당 CBSA 코드를 census.gov에서 확인 후 여기 universities 섹션에 추가할 것.
