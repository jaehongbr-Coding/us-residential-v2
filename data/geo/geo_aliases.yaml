university_abbreviations:
  # 2026.09 Phase 2.5: universities 섹션의 154개 대학명에서 기계적으로 생성한
  # 약칭 — 각 단어(of/the/and/at/for/in 제외) 첫 글자를 딴 것. 3글자 미만
  # (UT/UW/UA/UC/UM/UP 등 30개)과 두 대학 이상이 겹치는 것(12개: ASU/BSU/
  # CSU/GSU/MSU/OSU/TSU/UCB/USC/UTA/UWM/WSU — 예: UTA=Austin/Arlington,
  # UWM=Madison/Milwaukee, USC=South Carolina/Southern California)은 전부
  # 제외했다. "UGA"(University of Georgia 통칭)처럼 기계적 첫글자 조합으로는
  # 나오지 않는 실제 통칭은 이 방식으로 못 만든다 — 수작업 추가는 I8 위반이라
  # 하지 않았다. 전체 채택/제외 목록은 커밋 로그 및 작업 보고 참조.
  #
  # ⚠️ 2026.09 Phase 2.5 2차(백필 검증)에서 발견한 방법론 결함: 위 충돌
  # 검사는 "당시 코드가 있던 154개" 안에서만 겹치는지 봤다 — 그래서 미해결
  # 21건(당시 코드 없음)과만 겹치는 경우를 놓쳤다. 백필 후 실제 데이터로
  # 4건이 걸렸다: CSUF(California State-Fresno ↔ 당시 미해결이던 -Fullerton),
  # ISU(Iowa State ↔ 미해결이던 Illinois State), KSU(Kansas State ↔ 미해결
  # 이던 Kennesaw State **및** Kent State, 3파전), PSU(Portland State ↔
  # 미해결이던 Pennsylvania State) — 전부 원장 실측(Kennesaw State 기사 4건,
  # California State-Fullerton 기사 1건, Penn State 관련 1건)에서 오판정을
  # 확인하고 제거했다. 교훈: 약칭 충돌 검사는 "코드가 있는 대학"이 아니라
  # BLUE_VISTA_UNIVERSITIES 175개 전체를 대상으로 해야 한다 — 미해결 대학도
  # 나중에 코드가 생기거나, 코드 없이도 그 이름 자체가 다른 대학의 약칭과
  # 실제로 충돌할 수 있다.
