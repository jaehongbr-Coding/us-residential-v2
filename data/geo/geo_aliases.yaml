university_colloquial:
  # 2026.09 Phase 2.5 2차: 백필 검증에서 geo 0건이던 대학 22곳의 stage_a_json
  # 실측 추출 문자열을 집계해 채택했다(추측이 아니라 실제 Stage A 출력에서
  # 나온 문자열만). university_abbreviations(기계적 첫글자 조합)와 다른
  # 세 번째 패턴 — "Emory"(University 생략), "UMass"/"UMass Amherst"(포트맨토,
  # 첫글자 조합 불가), "UC Davis"(접두사+캠퍼스명) 같은 구어체 통칭이다.
  #
  # ⚠️ 충돌 검사는 BLUE_VISTA_UNIVERSITIES 175개에 대해서만 수행했다. 175개는
  # 우리 수집 축일 뿐 기사가 언급할 수 있는 대상의 전체 집합이 아니다 — 175개
  # 안에서 충돌이 없어도 폐집합 밖에서 흔히 쓰이는 통칭이면 채택하지 않는다.
  # 이 원칙으로 두 후보를 제외했다:
  #   - "UofM"(University of Memphis 기사에서 추출): 전국적으로 University of
  #     Michigan/Minnesota를 가리키는 데도 흔히 쓰인다.
  #   - "University of Hawaii"(bare, "at Manoa" 없이): 우리 목록엔 Manoa뿐이라
  #     충돌이 없지만, 실제 UH 시스템에는 Hilo(별도 CBSA)·West Oahu가 있다.
  #     "UH Manoa"만 채택.
  #   - "UW"(Washington State University 기사에서 추출): University of
  #     Washington(시애틀, 이미 이 파일에 등재됨)의 흔한 약칭과 충돌 — Stage A
  #     추출 오류로 의심되며, 채택 시 진짜 UW 기사가 오판정될 위험.
  # "<주 이름> State"(예: "Oklahoma State") 6건은 실제로 주 정부를 가리킬
  # 위험(예: "Oklahoma state legislature")을 원장 전체(14건 발견) 대상으로
  # 검증했다 — 전부 해당 대학 SH 피드 출처+캠퍼스 맥락이었다(주 정부 오탐 0건).
