  # 2026.09 Phase 2.5: 뉴욕시 5개 자치구. 추정이 아니라 Census 정의상 사실 —
  # 각각 County/County Equivalent와 1:1 대응하고(Manhattan=New York County,
  # Brooklyn=Kings County, Staten Island=Richmond County, Queens/Bronx는
  # county명과 동일) 전부 35620(New York-Newark-Jersey City, NY-NJ) CBSA에
  # 속함을 crosswalk의 county_idx로 검증했다(kings|NY/richmond|NY/new york|NY/
  # queens|NY/bronx|NY 전부 35620). 서브마켓(Harlem/Midtown 등)은 이번 라운드에
  # 넣지 않는다 — Midtown은 Atlanta에도 있고 Downtown은 전국에 있어 동명 충돌
  # 위험이 자치구와 다르다.
  # ⚠️ Queens/Bronx는 사실 county_idx로 주(state)가 주어지면 이미 정상 동작했다
  # (county명 자체가 "Queens"/"Bronx"라서). 여기 추가하는 건 주가 없을 때도
  # 되게 하려는 것 — geo_resolver의 우선순위 변경(주 명시 시 city/county 정확
  # 매칭이 이 alias보다 먼저 적용됨)과 맞물려, "Manhattan, KS"처럼 주가 명시된
  # 실제 다른 지명과는 절대 충돌하지 않는다(회귀 테스트로 고정).
  "Manhattan": "35620"
  "Brooklyn": "35620"
  "Queens": "35620"
  "Bronx": "35620"
  "The Bronx": "35620"
  "Staten Island": "35620"

  # 2026.09 geo resolver 진단: 크로스워크의 실제 키는 CBSA 타이틀 첫 세그먼트인
  # "New York"뿐이다. "New York City"가 매칭 안 되는 건 항목 부재가 아니라
  # 문자열 불일치다 — geo_norm.norm()이 " city"/" town" 접미사를 일괄 제거하지
  # 않는 이유는 그러면 "Oklahoma City, OK"/"Kansas City, MO-KS"/
  # "Carson City, NV" 같은 고유 지명이 bare 주 이름·다른 도시와 충돌해
  # 오판정을 낳기 때문이다(위 norm() 주석, tests의 test_carson_without_state_*
  # 참조) — 그 규칙은 되돌리지 않고 이 두 항목만 개별 alias로 추가한다.
  # "New York City"/"NYC"는 가리키는 대상이 유일해 UW/USC류 통칭 충돌
  # 위험이 없다(원장 실측: "New York City"/"NYC"가 primary로 나왔는데 실패한
  # 건이 110건 — Stage A는 정확히 추출했고 표기만 안 맞았다).
  "New York City": "35620"
  "NYC": "35620"

