# data/geo/geo_aliases.yaml
# alias(정규화 전 원문) -> CBSA 5자리 코드
# vintage 2023 (OMB Bulletin 23-01) 기준
#
# universities 섹션은 collector.py의 BLUE_VISTA_UNIVERSITIES 175개를 시드로,
# (city, state)로 cbsa_crosswalk.json의 city_idx를 조회해 자동 도출했다
# (scripts/build_geo_crosswalk.py 실행 시 항상 재생성 가능, 수작업 아님).
# 2026.09 Phase 1.5: geo_norm.norm()에 Census 법정명 정규화 규칙을 추가해
# city_idx 직접 매칭 2건(Louisville, Honolulu)을 추가 해소했고, 나머지는
# title_idx 접두사 매칭(Category B, "카운티 역참조" 대신 CBSA 타이틀 자체가
# <city>로 시작하는지 확인)으로 5건을 더 해소했다 — 이 5건은 city_idx
# 자동 도출이 아니므로 재실행해도 자동 재생성되지 않는다(아래에 고정 기재).
# 도출 성공 154건 / 미해결 21건 (미해결 목록은 파일
# 하단 주석 블록 참조, I8에 따라 이 섹션에는 넣지 않는다).
#
# 2026.09 Phase 2.5: 50건 샘플 검수에서 confidence=none 27건 중 11건이
# 대학이었다 — Stage A는 정확히 추출했으나("N.Y.U.") universities 섹션의
# 정식명("New York University")과 문자열이 달라 alias_idx가 못 찾았다.
# 세 갈래로 갭을 메웠다: ① geo_norm.norm_university()로 표기 변형("N.Y.U."
# ↔ "New York University", "... at Austin" ↔ "... - Austin") 흡수,
# ② geo_norm.campus_base() + geo_resolver의 캠퍼스 fallback으로 "University
# of Wisconsin"처럼 캠퍼스 미지정 언급을 후보 개수 확인 후 처리(1개면
# inferred, 2개 이상이면 절대 확정하지 않고 ambiguous — Columbia/Miami/
# Glendale과 같은 실패 패턴 재발 방지), ③ 아래 university_abbreviations
# 섹션. universities/university_abbreviations는 norm()이 아니라
# norm_university()로 별도 인덱스(university_idx)에 들어간다 — 지명
# 정규화 규칙과 대학명 정규화 규칙이 다르기 때문이다.

