name: Weekly Intelligence Report

on:
  schedule:
    - cron: '0 23 * * 0'  # 매주 일요일 23:00 UTC = 월요일 08:00 KST (daily 종료 후)
  workflow_dispatch:

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        run: python weekly_report.py --period weekly --export docx

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push reports
        run: |
          git add reports/*.md reports/*.docx
          git diff --cached --quiet || git commit -m "자동 주간 리포트 생성 $(date +%Y%m%d)"
          git pull --rebase origin main
          git push
