name: Monthly Market Collect
on:
  schedule:
    - cron: "0 2 29 * *"   # 매월 29일 02:00 UTC = 11:00 KST. Census 월간 공표(18번째 근무일, 늦으면 26~28일) 이후. 2월은 발화 안 함 → 3월 실행이 두 달치 처리
  workflow_dispatch:
concurrency: { group: monthly-market, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python market_collect.py bps
      - run: python market_collect.py soc
      # market_tagger.py 스텝은 Phase 2.4에서 추가
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market/
          git diff --cached --quiet && echo "변경 없음" || (git commit -m "auto: market data $(date +%Y-%m)" && git pull --rebase origin main && git push)
